services:
# This docker-compose file defines the services for the Zero Trust workshop, 
# including a backend, frontend, database, Vault, Vault Agent, 
# OpenLDAP, phpLDAPadmin, and Keycloak. 
# Each service is configured with appropriate environment variables, 
# volumes, ports, health checks, and dependencies to ensure they work together seamlessly 
# in the workshop environment.

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: zero_trust_db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - net-data
      - net-boundary-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault-enterprise:1.21.4-ent
    container_name: zero_trust_vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:Z
      - ./vault/config/vault.hclic:/vault/config/vault.hclic:Z
      - ./vault/audit:/vault/audit
      - vault_data:/vault/file
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_LICENSE_PATH: "/vault/config/vault.hclic"
    command: vault server -config=/vault/config/config.hcl
    networks:
      - net-data
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 > /dev/null 2>&1; [ $? -ne 1 ]"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-agent:
    image: hashicorp/vault-enterprise:1.21.4-ent
    container_name: zero_trust_vault_agent
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    entrypoint: ["vault", "agent", "-config=/vault/config/agent.hcl"]
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_LICENSE_PATH: "/vault/config/vault.hclic"
    volumes:
      - ./vault-agent/config:/vault/config:ro
      - ./vault/config/vault.hclic:/vault/config/vault.hclic:ro
      - vault-agent-secrets:/vault/secrets
    networks:
      - net-data
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/secrets/db-creds.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

# The ollama service runs a local instance of the Ollama language model server, 
# which is used in the workshop for AI-powered features.
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: zero_trust_ollama
    environment:
      OLLAMA_MODELS: "llama3.2 nomic-embed-text"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - net-data
      - net-egress
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

# The backend service runs the main application backend for the workshop, 
# which handles API requests, authentication flows, and integration with Vault and other services.
  backend:
    # Built locally and bind-mounted on purpose so workshop participants can
    # swap backend files such as connector.js and immediately change auth flows.
    image: repping/zero-trust-backend:1.8.18
    container_name: zero_trust_backend
    env_file:
      - .env
    environment:
      VAULT_AGENT_CREDS_FILE: /vault/secrets/db-creds.json    
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules # prevents bind-mount from shadowing container's node_modules
      - vault-agent-secrets:/vault/secrets:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - net-backend
      - net-data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# The frontend service runs the user interface for the workshop, 
# which interacts with the backend and provides a user-friendly way to explore the Zero Trust concepts and features.
  frontend:
    # Built locally and bind-mounted so the running UI always matches the
    # checked-out workshop code instead of a prebuilt image revision.
    image: repping/zero-trust-frontend:1.8.18
    container_name: zero_trust_frontend
    environment:
      VITE_API_URL: http://backend:3000
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_HOST_PORT: ${VITE_HOST_PORT:-8088}
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents bind-mount from shadowing container's node_modules
    ports:
      - "${VITE_HOST_PORT:-8088}:${VITE_PORT:-5173}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - net-frontend
      - net-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VITE_PORT:-5173}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# The openldap service provides an LDAP server for the workshop, which is used for authentication and user management 
# in integration with GitLab and Keycloak.
  openldap:
    image: osixia/openldap:1.5.0
    container_name: zero_trust_openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "MyOrg"
      LDAP_DOMAIN: "my.org"
      LDAP_ADMIN_PASSWORD: "admin"
    ports:
      - "1389:389"
      - "1636:636"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - net-data
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost:389 -D \"cn=admin,dc=my,dc=org\" -w \"$$LDAP_ADMIN_PASSWORD\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# The ldap-admin service provides a web-based interface for managing the OpenLDAP server, 
# allowing workshop participants to easily view and modify LDAP entries as needed for the exercises.
  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    container_name: zero_trust_ldap-admin
    profiles: [tools]
    restart: unless-stopped
    networks:
      - net-data
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      vault:
        condition: service_healthy
      openldap:
        condition: service_healthy

# The keycloak service runs an instance of Keycloak, which is used as the identity provider for the workshop, 
# allowing participants to explore SSO, OIDC, and other identity management features in the context of Zero Trust. 
# It is configured to use the OpenLDAP server as its user federation source.
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    container_name: zero_trust_keycloak
    command: >-
      start-dev
      --spi-ciba-auth-channel-ciba-http-auth-channel-http-authentication-channel-uri=http://backend:3000/ciba/request
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - net-data

# The following services are for the Boundary component of the workshop, 
# which demonstrates secure access brokering to protected resources.
  boundary-db:
    image: postgres:16
    container_name: zero_trust_boundary_db
    profiles: [access-control]
    environment:
      POSTGRES_DB: ${BOUNDARY_PG_DB}
      POSTGRES_USER: ${BOUNDARY_PG_USER}
      POSTGRES_PASSWORD: ${BOUNDARY_PG_PASSWORD}
    volumes:
      - boundary_db_data:/var/lib/postgresql/data
    networks:
      - net-boundary-control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOUNDARY_PG_USER} -d ${BOUNDARY_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  boundary-controller:
    image: hashicorp/boundary-enterprise:0.21.2-ent
    container_name: zero_trust_boundary_controller
    profiles: [access-control]
    depends_on:
      boundary-db:
        condition: service_healthy
    command: ["boundary", "server", "-config", "/boundary/config/controller.hcl"]
    cap_add:
      - IPC_LOCK
    environment:
      BOUNDARY_POSTGRES_URL: ${BOUNDARY_PG_URL}
      BOUNDARY_LICENSE: ${BOUNDARY_LICENSE}
      BOUNDARY_ROOT_KEY: ${BOUNDARY_ROOT_KEY}
      BOUNDARY_WORKER_AUTH_KEY: ${BOUNDARY_WORKER_AUTH_KEY}
      BOUNDARY_RECOVERY_KEY: ${BOUNDARY_RECOVERY_KEY}
    volumes:
      - ./boundary/config:/boundary/config:Z
      - boundary_controller_data:/boundary/data
    ports:
      - "9200:9200"
    networks:
      - net-boundary-control

  boundary-ingress-worker:
    image: hashicorp/boundary-enterprise:0.21.2-ent
    container_name: zero_trust_boundary_ingress
    profiles: [access-control]
    depends_on:
      boundary-controller:
        condition: service_started
    command: ["boundary", "server", "-config", "/boundary/config/ingress-worker.hcl"]
    cap_add:
      - IPC_LOCK
    environment:
      BOUNDARY_LICENSE: ${BOUNDARY_LICENSE}
      BOUNDARY_WORKER_AUTH_KEY: ${BOUNDARY_WORKER_AUTH_KEY}
      BOUNDARY_WORKER_AUTH_STORAGE_KEY: ${BOUNDARY_WORKER_AUTH_STORAGE_KEY}
    volumes:
      - ./boundary/config:/boundary/config:Z
      - boundary_ingress_data:/boundary/data
    ports:
      - "9202:9202"
    networks:
      - net-boundary-control
      - net-boundary-dmz

  boundary-egress-worker:
    image: hashicorp/boundary-enterprise:0.21.2-ent
    container_name: zero_trust_boundary_egress
    profiles: [access-control]
    depends_on:
      boundary-ingress-worker:
        condition: service_started
    command: ["boundary", "server", "-config", "/boundary/config/egress-worker.hcl"]
    cap_add:
      - IPC_LOCK
    environment:
      BOUNDARY_LICENSE: ${BOUNDARY_LICENSE}
      BOUNDARY_WORKER_AUTH_KEY: ${BOUNDARY_WORKER_AUTH_KEY}
      BOUNDARY_WORKER_AUTH_STORAGE_KEY: ${BOUNDARY_WORKER_AUTH_STORAGE_KEY}
    volumes:
      - ./boundary/config:/boundary/config:Z
      - boundary_egress_data:/boundary/data
    networks:
      - net-boundary-dmz
      - net-boundary-private
      - net-data

  boundary-target:
    image: nginx:alpine
    container_name: zero_trust_boundary_target
    profiles: [access-control]
    networks:
      - net-boundary-private

  boundary-ssh:
    image: rastasheep/ubuntu-sshd:18.04
    container_name: zero_trust_boundary_ssh
    profiles: [access-control]
    networks:
      - net-boundary-private      

networks:
  net-frontend:
    driver: bridge
    internal: true
  net-backend:
    driver: bridge
    internal: true
  net-data:
    driver: bridge
    internal: true
  net-egress:
    driver: bridge

# Boundary services are on their own set of internal networks to simulate a real-world deployment 
# where the controller and workers would be in separate network zones for security. 
# The target is on a private network that only the egress worker can access, 
# demonstrating how Boundary can broker access to resources in a protected network segment.    
  net-boundary-control:
    driver: bridge
    internal: true

  net-boundary-dmz:
    driver: bridge
    internal: true

  net-boundary-private:
    driver: bridge
    internal: true    

volumes:
  db_data:
  vault_data:
  vault-agent-secrets:
  ollama_data:
  openldap-data:
  openldap-config:
  keycloak_data:

# Boundary volumes for persistence of database and server state across restarts.
  boundary_db_data:
  boundary_controller_data:
  boundary_ingress_data:
  boundary_egress_data: