services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: zero_trust_db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - net-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault-enterprise:1.21.3-ent
    container_name: zero_trust_vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:Z
      - ./vault/config/vault.hclic:/vault/config/vault.hclic:Z
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_LICENSE_PATH: "/vault/config/vault.hclic"
    command: vault server -config=/vault/config/config.hcl
    networks:
      - net-data
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 > /dev/null 2>&1; [ $? -ne 1 ]"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: zero_trust_ollama
    environment:
      OLLAMA_MODELS: "llama3.2 nomic-embed-text"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - net-data
      - net-egress
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zero_trust_backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_MODE: dynamic
      VAULT_DB_ROLE: app-role
      VAULT_KV_PATH: secret/data/postgres
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      OLLAMA_ADDR: http://ollama:11434
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - net-backend
      - net-data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zero_trust_frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - net-frontend
      - net-backend

networks:
  net-frontend:
    driver: bridge
    internal: true
  net-backend:
    driver: bridge
    internal: true
  net-data:
    driver: bridge
    internal: true
  net-egress:
    driver: bridge

volumes:
  db_data:
  ollama_data:
